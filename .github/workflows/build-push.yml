name: Build and Push

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '分支名 (如 wip-build)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build UI
        run: pnpm ui:build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-dist
          path: |
            dist/
            ui/dist/
          retention-days: 1
